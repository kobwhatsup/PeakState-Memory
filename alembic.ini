[alembic]
script_location = alembic
prepend_sys_path = .

# 使用同步驱动（Alembic 迁移运行器不支持 async）
# 实际值从 .env 读取，此处为占位
sqlalchemy.url = postgresql://postgres:password@localhost:5432/peakstate

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
